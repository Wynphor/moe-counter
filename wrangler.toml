name = "moe-counter"
main = "dist/worker.js"
compatibility_date = "2024-02-27"
# 使用默认 workers.dev：https://moe-counter.fwan9678.workers.dev
# 不要对 *.workers.dev 使用 custom_domain（仅适用于自有域名）
workers_dev = true

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "moe-counter"
database_id = "8ba3d2ae-c7ae-4a09-9621-bc1ffe67b3d4"
